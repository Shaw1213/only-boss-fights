<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="icon" type="image/png" href="TemplateData/favicon.png">
    <style>
      /* The game fills whatever frame itch.io gives it (and the whole screen in fullscreen), letterboxed to 16:9 so the
         framing and the HUD stay as designed. */
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0d0a12; }
      #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      #unity-canvas {
        width: min(100vw, calc(100vh * 16 / 9));
        height: min(100vh, calc(100vw * 9 / 16));
        display: block; background: #000; outline: none;
      }
      #loading {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 4vh; background: #0d0a12; transition: opacity 0.4s;
      }
      #loading img { width: min(60vw, 720px); height: auto; }
      #bar { width: min(40vw, 420px); height: 6px; background: #2a2233; border-radius: 3px; overflow: hidden; }
      #fill { width: 0; height: 100%; background: #ecc478; transition: width 0.2s; }
      #hint { color: #a39aae; font: 14px Georgia, serif; letter-spacing: 0.05em; }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="unity-canvas" tabindex="-1"></canvas></div>
    <div id="loading">
      <img src="TemplateData/logo.png" alt="Only Boss Fights: The Fallen Knight">
      <div id="bar"><div id="fill"></div></div>
      <div id="hint">Loading... click the game to play (and turn the sound on)</div>
    </div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      // Keyboard focus follows a click on the game (itch.io embeds it in a frame).
      canvas.addEventListener("pointerdown", function () { canvas.focus(); window.focus(); });
      createUnityInstance(canvas, {
        arguments: [],
#if PROGRESSIVE_ASSET_LOADING
        primaryDataUrls: {{{ JSON.stringify(PRIMARY_DATA_FILES) }}},
        secondaryDataUrls: {{{ JSON.stringify(SECONDARY_DATA_FILES) }}},
#else
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
#endif
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      }, function (progress) {
        document.querySelector("#fill").style.width = (100 * progress) + "%";
      }).then(function (unityInstance) {
        var loading = document.querySelector("#loading");
        loading.style.opacity = "0";
        setTimeout(function () { loading.remove(); }, 450);
        window.unityInstance = unityInstance;
      }).catch(function (message) {
        document.querySelector("#hint").textContent = "Couldn't start the game: " + message;
      });
    </script>
  </body>
</html>
